<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <style>
        h1{text-align:center;}
        table{text-align:center; margin:0 auto;}
        div{text-align:center;}
        table,th,td{border:1px solid black; border-collapse: collapse;}
        th,td{width:150px; height:40px;}
        button{width:100px; height:40px;}

    </style>
</head>
<body>
    <h1>학생정보리스트</h1>
    <table>
        <tr>
            <th>번호</th>
            <th>이름</th>
            <th>학과</th>
            <th>학년</th>
            <th>나이</th>
            <th>성별</th>
            <th>취미</th>
        </tr>
        {%for s in list%}
        <tr>
            <td>{{s.no}}</td>
            <td><a href='{%url 'students:sview' s.no %}'>{{s.name}}</a></td>
            <td>{{s.major}}</td>
            <td>{{s.grade}}</td>
            <td>{{s.age}}</td>
            <td>{{s.gender}}</td>
            <td>{{s.hobby}}</td>
        </tr>
        {% endfor %}
    </table>
    <div>
        <a href='{% url 'students:swrite' %}'><button type='button'>쓰기</button></a>
        <a href='/'><button type='button'>홈으로</button></a>

    </div>
</body>
</html>
