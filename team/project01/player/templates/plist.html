<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K리그 선수목록</title>
</head>
<body>
    <h1>K리그 선수목록</h1>
    <table border="1">
        <tr>
            <th>번호</th>
            <th>팀</th>
            <th>선수명</th>
            <th>등번호</th>
            <th>포지션</th>
            <th>나이</th>
        </tr>
        {% for p in list %}
        <tr>
            <td>{{p.id}}</td>
            <td>{{p.team}}</td>
            <td>{{p.name}}</td>
            <td>{{p.number}}</td>
            <td>{{p.position}}</td>
            <td>{{p.age}}</td>
        </tr>
        {% endfor %}
        

    </table>



</body>
</html>
