<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,th,td{border: 1px solid black; border-collapse: collapse;}
        th,td{width: 150px; height: 40px;}

    </style>
</head>
<body>
    <h1>학생성적리스트</h1>

    <table>
        <tr>
            <th>이름</th>
            <th>학과</th>
            <th>나이</th>
            <th>학년</th>
            <th>성별</th>
        </tr>
        {%for s in list%}
        <tr>
            <td><a href='/students/sview/{{s.name}}'>{{s.name}}</a></td>
            <td>{{s.major}}</td>
            <td>{{s.age}}</td>
            <td>{{s.grade}}</td>
            <td>{{s.gender}}</td>
        </tr>
        {% endfor %}
    </table>
    <a href='/students/swrite/'><button>정보입력</button></a>
    <a href='/'><button>홈으로</button></a>

</body>
</html>
